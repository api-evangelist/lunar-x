description: 'Lunar-X (Lunar X) is a global digital content studio that acquires, develops,
  and operates creator-driven entertainment brands into globally recognized franchises
  across animation, educational content, functional music, ecommerce, and live events.
  Its properties include Economics Explained, Theorist Inc, Music Labs, and Lunar Kids,
  collectively spanning tens of billions of views and over a hundred million subscribers.
  The company was surfaced as a portfolio company of Creandum and added to the API
  Evangelist network. As a media/content operator it publishes a marketing website
  and privacy policy but exposes no public developer API, documentation, or developer
  portal.'
